<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Playing Card Game</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>

        <div class="game-board">
            <div class="top-row">
                <div class="wastepile-container">
                  <div id="deck-pile" class="deck-pile"></div>
                  <div id="waste-pile" class="waste-pile"></div>
                </div>

                <div class="foundation-pile-container">
                  <div id="foundation-pile-0" class="foundation-pile"></div>
                  <div id="foundation-pile-1" class="foundation-pile"></div>
                  <div id="foundation-pile-2" class="foundation-pile"></div>
                  <div id="foundation-pile-3" class="foundation-pile"></div>
                </div>
                <div class="interactive-ui-container">
                    <div id="game-score">Score: 0</div>
                    <button type="button" id="reset-button">New Game</button>
                </div>
            </div>
            
            <div class="tableau-container">
                <div id="tableau-0" class="tableau"></div>
                <div id="tableau-1" class="tableau"></div>
                <div id="tableau-2" class="tableau"></div>
                <div id="tableau-3" class="tableau"></div>
                <div id="tableau-4" class="tableau"></div>
                <div id="tableau-5" class="tableau"></div>
                <div id="tableau-6" class="tableau"></div>
            </div>
            
        </div>
<script src="script.js"></script>
    </body>
</html>
